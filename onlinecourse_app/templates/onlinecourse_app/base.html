<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Course{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'onlinecourse_app:course_list' %}">Online Course</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="navbar-text me-3">{{ user.username }}</span>
                <a class="btn btn-outline-light btn-sm" href="/admin/logout/?next=/">Log out</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
